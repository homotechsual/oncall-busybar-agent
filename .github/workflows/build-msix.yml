name: Build MSIX package

# Checks the Store package still builds on every push. The versioned .msixupload to submit to
# Partner Center comes from the store job in release.yml.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/OncallAgent/**"
      - "test/OncallAgent.Tests/**"
      - "OncallAgent.Package/**"
      - ".github/workflows/build-msix.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore
        run: dotnet restore test/OncallAgent.Tests/OncallAgent.Tests.csproj

      - name: Run tests
        run: dotnet test test/OncallAgent.Tests/OncallAgent.Tests.csproj --configuration Release --no-restore

      # The .wapproj isn't SDK-style, so `dotnet restore` doesn't cover it.
      - name: Restore packaging project
        run: msbuild OncallAgent.Package/OncallAgent.Package.wapproj /t:Restore /p:Configuration=Release

      # Unsigned on purpose: the Store signs the package after certification.
      #
      # 10.0.26100.0 is the newest Windows SDK on windows-latest; the .wapproj targets a newer one
      # locally. Pass it as PackageTargetPlatformVersion, not TargetPlatformVersion: global
      # properties flow into OncallAgent.csproj, and overriding TargetPlatformVersion there swaps
      # the Windows SDK projection pack and fails with NETSDK1112.
      - name: Build and publish MSIX bundle
        run: >
          msbuild OncallAgent.Package/OncallAgent.Package.wapproj
          /t:Publish
          /p:Configuration=Release
          /p:AppxBundlePlatforms="x86|x64|arm64"
          /p:AppxBundle=Always
          /p:UapAppxPackageBuildMode=StoreUpload
          /p:AppxPackageSigningEnabled=false
          /p:PackageTargetPlatformVersion=10.0.26100.0
          /p:AppxPackageDir=AppPackages\

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: OncallAgent-Package
          path: OncallAgent.Package/AppPackages/**
          if-no-files-found: error
