name: Release

# Builds an MSI per architecture and a sideload MSIX bundle, signs them with Azure Artifact
# Signing and attaches them to a GitHub Release. Also builds the Store .msixupload and, for tags,
# submits it to Partner Center. Azure and Partner Center setup is in OncallAgent.Msi/README.md.
# Signing jobs run in the "release" environment because the federated credential is scoped to it.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.0.0 or v1.0.0)"
        required: true
        type: string

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          VERSION="${VERSION#v}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore test/OncallAgent.Tests/OncallAgent.Tests.csproj

      - name: Run tests
        run: dotnet test test/OncallAgent.Tests/OncallAgent.Tests.csproj --configuration Release --no-restore

  msi:
    needs: [version, test]
    runs-on: windows-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        include:
          - rid: win-x86
            platform: x86
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: arm64
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained build
        run: >
          dotnet publish src\OncallAgent\OncallAgent.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -p:Version=${{ env.VERSION }}
          -o publish\${{ matrix.rid }}

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The runtime files are already signed by Microsoft; only the exe and dll are ours.
      - name: Sign the published app
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: |-
            ${{ github.workspace }}\publish\${{ matrix.rid }}\OncallAgent.exe
            ${{ github.workspace }}\publish\${{ matrix.rid }}\OncallAgent.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build the MSI
        shell: pwsh
        run: |
          $publishDir = (Resolve-Path "publish\${{ matrix.rid }}").Path
          dotnet build OncallAgent.Msi\OncallAgent.Msi.wixproj `
            -p:Platform=${{ matrix.platform }} `
            -p:Version=$env:VERSION `
            -p:PublishDir=$publishDir `
            -p:Configuration=Release

      # Every architecture builds OncallAgent.Msi.msi, so give each a unique name.
      - name: Rename MSI with architecture suffix
        id: msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem "OncallAgent.Msi\bin\${{ matrix.platform }}\Release\*.msi" | Select-Object -First 1
          $dest = Join-Path $msi.DirectoryName "oncall-busybar-agent-$env:VERSION-${{ matrix.platform }}.msi"
          Move-Item -Path $msi.FullName -Destination $dest
          "path=$dest" >> $env:GITHUB_OUTPUT

      # Signing the exe doesn't sign the MSI around it.
      - name: Sign the MSI
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ steps.msi.outputs.path }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-msi-${{ matrix.platform }}
          path: ${{ steps.msi.outputs.path }}
          if-no-files-found: error

  msix:
    needs: [version, test]
    runs-on: windows-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      # The manifest's Publisher must match the certificate subject exactly. The checked-in value
      # is the Store identity, so swap it for this build.
      - name: Set sideload package identity
        shell: pwsh
        env:
          PUBLISHER: ${{ secrets.AZURE_ARTIFACT_SIGNING_PUBLISHER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PUBLISHER)) {
            throw "AZURE_ARTIFACT_SIGNING_PUBLISHER secret is not set"
          }
          $manifestPath = (Resolve-Path "OncallAgent.Package\Package.appxmanifest").Path
          $manifest = New-Object System.Xml.XmlDocument
          $manifest.PreserveWhitespace = $true
          $manifest.Load($manifestPath)
          $manifest.Package.Identity.Publisher = $env:PUBLISHER
          $manifest.Package.Identity.Version = "$env:VERSION.0"
          $manifest.Save($manifestPath)

      - name: Restore packaging project
        run: msbuild OncallAgent.Package/OncallAgent.Package.wapproj /t:Restore /p:Configuration=Release

      # See build-msix.yml for why this is PackageTargetPlatformVersion.
      - name: Build sideload MSIX bundle
        run: >
          msbuild OncallAgent.Package/OncallAgent.Package.wapproj
          /t:Publish
          /p:Configuration=Release
          /p:Version=${{ env.VERSION }}
          /p:AppxBundlePlatforms="x86|x64|arm64"
          /p:AppxBundle=Always
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxPackageSigningEnabled=false
          /p:AppxAutoIncrementPackageRevision=false
          /p:PackageTargetPlatformVersion=10.0.26100.0
          /p:AppxPackageDir=AppPackages\

      - name: Rename bundle
        id: bundle
        shell: pwsh
        run: |
          $bundle = Get-ChildItem "OncallAgent.Package\AppPackages" -Recurse -Filter *.msixbundle | Select-Object -First 1
          $dest = Join-Path $bundle.DirectoryName "oncall-busybar-agent-$env:VERSION.msixbundle"
          Move-Item -Path $bundle.FullName -Destination $dest
          "path=$dest" >> $env:GITHUB_OUTPUT

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the MSIX bundle
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ steps.bundle.outputs.path }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-msix
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error

  # Unsigned: the Store signs it after certification. The artifact isn't attached to the GitHub
  # release; upload it to Partner Center as a new submission.
  store:
    needs: [version, test]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      # The checked-in identity is already the Store one; only the version changes. The Store
      # requires the last part to be 0.
      - name: Set package version
        shell: pwsh
        run: |
          $manifestPath = (Resolve-Path "OncallAgent.Package\Package.appxmanifest").Path
          $manifest = New-Object System.Xml.XmlDocument
          $manifest.PreserveWhitespace = $true
          $manifest.Load($manifestPath)
          $manifest.Package.Identity.Version = "$env:VERSION.0"
          $manifest.Save($manifestPath)

      - name: Restore packaging project
        run: msbuild OncallAgent.Package/OncallAgent.Package.wapproj /t:Restore /p:Configuration=Release

      - name: Build Store package
        run: >
          msbuild OncallAgent.Package/OncallAgent.Package.wapproj
          /t:Publish
          /p:Configuration=Release
          /p:Version=${{ env.VERSION }}
          /p:AppxBundlePlatforms="x86|x64|arm64"
          /p:AppxBundle=Always
          /p:UapAppxPackageBuildMode=StoreUpload
          /p:AppxPackageSigningEnabled=false
          /p:AppxAutoIncrementPackageRevision=false
          /p:PackageTargetPlatformVersion=10.0.26100.0
          /p:AppxPackageDir=AppPackages\

      - name: Upload Store package artifact
        uses: actions/upload-artifact@v7
        with:
          name: store-msixupload-${{ env.VERSION }}
          path: OncallAgent.Package/AppPackages/*.msixupload
          if-no-files-found: error

  # Submits the Store package for certification on tag pushes, once everything else has built.
  # The annotated tag's message becomes the "What's new" text. Partner Center setup is in
  # OncallAgent.Msi/README.md.
  store-submit:
    needs: [version, msi, msix, store]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    environment: release
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRODUCT_ID: 9P1XRPJT3126

    steps:
      - uses: actions/checkout@v7

      # checkout doesn't fetch the tag object, so its message isn't available otherwise. A
      # lightweight tag, or one whose message is just the tag name, gives no release notes.
      - name: Read release notes from the tag
        shell: pwsh
        run: |
          git fetch --force origin "refs/tags/${env:GITHUB_REF_NAME}:refs/tags/${env:GITHUB_REF_NAME}"
          $type = git cat-file -t $env:GITHUB_REF_NAME
          $notes = if ($type -eq 'tag') { (git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' $env:GITHUB_REF_NAME | Out-String).Trim() } else { '' }
          if ($notes -eq $env:GITHUB_REF_NAME) { $notes = '' }
          # The Store's limit for release notes.
          if ($notes.Length -gt 1500) { $notes = $notes.Substring(0, 1500) }
          Set-Content -Path release-notes.txt -Value $notes -NoNewline
          if ($notes) { "Release notes:`n$notes" } else { "No release notes in the tag" }

      - name: Download Store package
        uses: actions/download-artifact@v8
        with:
          name: store-msixupload-${{ env.VERSION }}
          path: store

      - name: Setup Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Configure Microsoft Store Developer CLI
        run: |
          msstore settings --enableTelemetry false
          msstore reconfigure --tenantId ${{ secrets.PARTNER_CENTER_TENANT_ID }} --sellerId ${{ secrets.PARTNER_CENTER_SELLER_ID }} --clientId ${{ secrets.PARTNER_CENTER_CLIENT_ID }} --clientSecret ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}

      # publish replaces any pending draft with a copy of the last published submission, so the
      # release notes have to be set after it, and the draft committed last.
      - name: Upload package to a draft submission
        shell: pwsh
        run: |
          $package = Get-ChildItem store -Filter *.msixupload | Select-Object -First 1
          msstore publish $package.DirectoryName --inputFile $package.FullName --appId $env:PRODUCT_ID --noCommit
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed" }

      - name: Set release notes
        shell: pwsh
        run: |
          $notes = Get-Content -Raw release-notes.txt -ErrorAction SilentlyContinue
          if (-not $notes) { "Leaving release notes blank"; return }
          $submission = msstore submission get $env:PRODUCT_ID | Out-String | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "msstore submission get failed" }
          $listing = $submission.Listings.'en-us'
          if (-not $listing) { throw "The submission has no en-us listing" }
          $listing.BaseListing.ReleaseNotes = $notes
          msstore submission update $env:PRODUCT_ID ($submission | ConvertTo-Json -Depth 100 -Compress)
          if ($LASTEXITCODE -ne 0) { throw "msstore submission update failed" }

      - name: Submit for certification
        shell: pwsh
        run: |
          msstore submission publish $env:PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw "msstore submission publish failed" }

  release:
    needs: [msi, msix]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-artifacts/*.msi
            release-artifacts/*.msixbundle
